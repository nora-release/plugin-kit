[workspace]
members = [
    "crates/nora-network",
    "crates/nora-plugin",
    "crates/nora-plugin-manifest",
    "crates/nora-provider-plugin-sdk",
]
exclude = ["crates/nora-network/vendor/reqwest"]
resolver = "2"

[workspace.package]
version = "0.24.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/nora-release/plugin-kit"

[patch.crates-io]
reqwest = { path = "crates/nora-network/vendor/reqwest" }
