[workspace]
members = [
    "crates/nora-plugin",
    "crates/nora-plugin-protocol",
    "crates/nora-plugin-runtime-sdk",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.92"
repository = "https://github.com/nora-release/plugin-kit"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
