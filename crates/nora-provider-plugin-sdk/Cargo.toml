[package]
name = "nora-provider-plugin-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust provider plugin protocol and streaming runtime managed by Nora."

[lib]
name = "nora_provider_plugin_sdk"
path = "src/lib.rs"

[[example]]
name = "nora-provider-openai"
path = "examples/openai-compatible/main.rs"

[features]
default = []
# Application roots enabling this feature supply the fixed reqwest source patch.
ipv4-fallback = ["nora-network/ipv4-fallback"]

[dependencies]
nora-network = { path = "../nora-network" }
nora-plugin-manifest = { path = "../nora-plugin-manifest" }
async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks"] }
tokio = { version = "1", features = ["fs", "io-util", "io-std", "rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
socket2 = "0.6"
time = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["net", "time"] }

[[example]]
name = "nora-test-gateway-hook"
path = "test/fixtures/gateway_hook.rs"
