name: Validate marketplace

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the reviewed catalog
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: reviewed
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout proposed catalog
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: registry
          persist-credentials: false
      - name: Install the pinned Nora plugin tool
        run: cargo install --locked --git https://github.com/nora-release/plugin-kit --tag v__PLUGIN_KIT_VERSION__ nora-plugin
      - name: Validate catalog and release archives without running plugins
        env:
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          PREVIOUS_COMMIT: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          baseline=()
          if [[ "$IS_PULL_REQUEST" == true ]]; then
            baseline=(--baseline "$GITHUB_WORKSPACE/reviewed/registry.json")
          elif [[ "$PREVIOUS_COMMIT" =~ ^[0-9a-f]{40}$ && "$PREVIOUS_COMMIT" != 0000000000000000000000000000000000000000 ]]; then
            git -C "$GITHUB_WORKSPACE/reviewed" show "$PREVIOUS_COMMIT:registry.json" > "$RUNNER_TEMP/previous-registry.json"
            baseline=(--baseline "$RUNNER_TEMP/previous-registry.json")
          fi
          nora-plugin validate \
            --registry "$GITHUB_WORKSPACE/registry/registry.json" \
            --catalog "$GITHUB_WORKSPACE/registry/marketplace.json" \
            --verify-downloads "${baseline[@]}"
