name: SDK Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/sdk-ci.yml
    with:
      release_tag: ${{ github.ref_name }}
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish SDK source release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)"
          if [[ "$release_commit" != "$GITHUB_SHA" ]]; then
            printf 'The release tag changed after validation.\n' >&2
            exit 1
          fi
          release_flags=(--latest)
          if [[ "${GITHUB_REF_NAME%%+*}" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "NoraPluginKit $GITHUB_REF_NAME" --generate-notes "${release_flags[@]}"
