name: SDK CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to compare with sdk-version.json
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: Swift and Rust (${{ matrix.toolchain }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [minimum, default]
    steps:
      - name: Checkout SDK
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Swift 6.1 for minimum compatibility
        if: matrix.toolchain == 'minimum'
        shell: bash
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_16.3.app/Contents/Developer
          printf 'DEVELOPER_DIR=/Applications/Xcode_16.3.app/Contents/Developer\n' >> "$GITHUB_ENV"
      - name: Verify Swift toolchain and SDK version
        env:
          SDK_RELEASE_TAG: ${{ inputs.release_tag || '' }}
          SDK_TOOLCHAIN: ${{ matrix.toolchain }}
        shell: bash
        run: |
          set -euo pipefail
          swift_version="$(swift --version 2>&1)"
          printf '%s\n' "$swift_version"
          [[ "$swift_version" =~ Swift\ version\ ([0-9]+)\.([0-9]+) ]]
          major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}"
          if (( major < 6 || (major == 6 && minor < 1) )); then
            printf 'Swift 6.1 or newer is required.\n' >&2
            exit 1
          fi
          if [[ "$SDK_TOOLCHAIN" == minimum && "$major.$minor" != 6.1 ]]; then
            printf 'The minimum compatibility job must use Swift 6.1.\n' >&2
            exit 1
          fi
          tag_option=()
          [[ -z "$SDK_RELEASE_TAG" ]] || tag_option=(--tag "$SDK_RELEASE_TAG")
          cargo run --quiet -p nora-plugin -- sdk-version ${tag_option[@]+"${tag_option[@]}"}
      - name: Build Swift Package
        run: make build
      - name: Test Swift Package and Rust crates
        run: make test
      - name: Package the native example with ad hoc signing
        run: make example
